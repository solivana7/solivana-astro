[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karmic-interpreter-app"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "flatlib==0.2.3",
  "pyswisseph==2.10.3.2",
]

[tool.setuptools]
packages = []

[tool.uv]
override-dependencies = [
  "pyswisseph==2.10.3.2",
]
